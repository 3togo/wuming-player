plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
}

group = 'com.wuming.tv'
version = '0.1.0-SNAPSHOT'

base {
    archivesName = 'tvbox-guarded-catvod-host'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation project(':libraries:guarded-runtime')
    implementation libs.gson
    implementation libs.okhttp
    implementation libs.android.json
    testImplementation libs.junit
}

tasks.named('check') {
    dependsOn rootProject.tasks.named('verifyCodeLifecycleIsolation')
}

// Gradle launcher properties are not inherited by its forked test JVM.
// Keep hardware access opt-in and preserve an explicitly configured ADB tunnel port.
tasks.named('test') {
    ['tvbox.guarded.hardware.test.serial', 'tvbox.guarded.webview.adbPort'].each { key ->
        def value = providers.systemProperty(key).orNull
        if (value != null) systemProperty(key, value)
    }
}
