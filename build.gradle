    dependsOn 'verifyJavaRetention'
    dependsOn unitAcceptanceTasks
    dependsOn verifyCodeLifecycleIsolation, verifyGenericLibraryBoundaries, verifyDesktopBoundaries
}

// Align Room's kotlin-metadata-jvm reader (pulled transitively by room-compiler-processing)
// with the Kotlin 2.4.10 compiler that emits Kotlin metadata 2.4.0. Without this, Room's
// annotation processing cannot parse the core libraries' Kotlin metadata and the app build fails
// with "Provided Metadata instance has version 2.4.0, while maximum supported version is 2.3.0".
allprojects {
    configurations.all {
        // Android supplies XmlPullParser; desktop uses its JDK StAX implementation.
        exclude group: 'xpp3', module: 'xpp3'
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.10'
        }
    }
}

subprojects {
    tasks.matching { it.name == 'check' || it.name == 'preBuild' }.configureEach {
        dependsOn rootProject.tasks.named('verifyCodeLifecycleIsolation')
        dependsOn rootProject.tasks.named('verifyJavaRetention')
    }
}
gradle.projectsEvaluated {
    genericLibraryPackages.each { libraryName, packagePrefix ->
        def libraryProject = rootProject.findProject(":libraries:${libraryName}")
        if (libraryProject == null) {
            genericModelViolations << "Generic library is not included in settings.gradle: ${libraryName}"
        } else if (libraryProject.plugins.hasPlugin('com.android.application') ||
                libraryProject.plugins.hasPlugin('com.android.library')) {
            genericModelViolations << "Generic library applies an Android plugin: ${libraryProject.path}"
        } else {
            libraryProject.configurations.each { configuration ->
                configuration.dependencies.withType(org.gradle.api.artifacts.ProjectDependency).each { dependency ->
                    if (!dependency.path.startsWith(':libraries:') && dependency.path != ':vendor:cling') {
                        genericModelViolations << "${libraryProject.path}:${configuration.name} depends on " +
                                "platform module ${dependency.path}"
                    }
                }
            }
        }
    }
    def desktopProject = rootProject.findProject(':desktop')
    if (desktopProject == null) {
        desktopModelViolations << ':desktop is not included in settings.gradle'
    } else {
        if (desktopProject.plugins.hasPlugin('com.android.application') ||
                desktopProject.plugins.hasPlugin('com.android.library')) {
            desktopModelViolations << ':desktop applies an Android plugin'
        }
        desktopProject.configurations.each { configuration ->
            configuration.dependencies.withType(org.gradle.api.artifacts.ProjectDependency).each { dependency ->
                def allowedGuardHost = configuration.name == 'runtimeOnly' &&
                        dependency.path == ':guarded-catvod-host'
                if (!dependency.path.startsWith(':libraries:') && !allowedGuardHost) {
                    desktopModelViolations << ":desktop:${configuration.name} depends on platform module ${dependency.path}"
                }
            }
        }
    }
    def isolatedRoot = rootProject.file('isolated').canonicalFile.toPath()
    rootProject.allprojects.each { candidate ->
        if (candidate == rootProject) return
        def projectPath = candidate.projectDir.canonicalFile.toPath()
        if (projectPath.startsWith(isolatedRoot)) {
            lifecycleModelViolations << "${candidate.path} is included from the isolated code tree"
        }

        def inspectedContainers = Collections.newSetFromMap(new IdentityHashMap())
        def inspectSourceSets = { container ->
            if (container == null || !inspectedContainers.add(container)) return
            container.each { sourceSet ->
                sourceSet.properties.each { propertyName, sourceDirectory ->
                    if (sourceDirectory == null ||
                            !sourceDirectory.metaClass.respondsTo(sourceDirectory, 'getSrcDirs')) {
                        return
                    }
                    sourceDirectory.srcDirs.each { sourceRoot ->
                        if (sourceRoot.canonicalFile.toPath().startsWith(isolatedRoot)) {
                            lifecycleModelViolations << "${candidate.path}:${sourceSet.name}.${propertyName} " +
                                    "uses isolated source directory ${sourceRoot.path}"
                        }
                    }
                }
            }
        }
        inspectSourceSets(candidate.extensions.findByName('sourceSets'))
        inspectSourceSets(candidate.extensions.findByName('android')?.sourceSets)
    }

    isolatedNativeSources.each { sourceName, metadata ->
        if (rootProject.findProject(":${sourceName}") != null) {
            lifecycleModelViolations << ":${sourceName} is isolated native source and must not be included"
        }
    }
}

