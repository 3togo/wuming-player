// Capture only plain values for task actions; inspect Gradle models after every
// project has been configured, before the configuration cache is serialized.
def verificationRoot = rootDir
def genericModelViolations = []
def desktopModelViolations = []
def lifecycleModelViolations = []

def verifyGenericLibraryBoundaries = tasks.register('verifyGenericLibraryBoundaries') {
    group = 'verification'
    description = 'Enforces package ownership and prevents Android dependencies in generic libraries.'

    def librarySources = fileTree(new File(verificationRoot, 'libraries')) {
        include '*/src/**/*.java', '*/src/**/*.kt'
    }
    def androidSources = fileTree(rootProject.file('app/src')) {
        include '**/*.java', '**/*.kt'
    }

    def sharedVendorSources = fileTree(new File(verificationRoot, 'vendor/cling/src/main/java')) {
        include '**/*.java'
    }

    doLast {
        def violations = new ArrayList(genericModelViolations)
        def librariesRoot = new File(verificationRoot, 'libraries').canonicalFile.toPath()

        genericLibraryPackages.each { libraryName, packagePrefix ->
            def libraryDir = new File(verificationRoot, "libraries/${libraryName}")
            if (!libraryDir.isDirectory()) {
                violations << "Generic library directory is missing: libraries/${libraryName}"
            }
        }

        librarySources.each { source ->
            def relative = librariesRoot.relativize(source.canonicalFile.toPath())
            def libraryName = relative.getName(0).toString()
            def expectedPackage = genericLibraryPackages[libraryName]
            if (expectedPackage == null) {
                violations << "Unregistered generic library source: ${source.path}"
                return
            }
            def packageDeclaration = source.readLines().find { line ->
                line ==~ /\s*package\s+\S+\s*;?\s*/
            }
            def packagePattern = ~("\\s*package\\s+" +
                    java.util.regex.Pattern.quote(expectedPackage) + "(?:\\..+)?\\s*;?\\s*")
            if (packageDeclaration == null || !(packageDeclaration ==~ packagePattern)) {
                violations << "${source.path}: ${libraryName} must own only ${expectedPackage}.*"
            }
            source.eachLine { line, number ->
                if (line ==~ /\s*import\s+(?:static\s+)?android(?:\..*)?\s*;?\s*/ ||
                        line ==~ /\s*import\s+(?:static\s+)?androidx(?:\..*)?\s*;?\s*/ ||
                        line ==~ /\s*import\s+(?:static\s+)?com\.wuming\.android(?:\..*)?\s*;?\s*/) {
                    violations << "${source.path}:${number}: ${line.trim()}"
                }
            }
        }

        // Frozen Cling protocol source is shared; its Android adapters are a separate module.
        sharedVendorSources.each { source ->
            source.eachLine { line, number ->
                if (line ==~ /\s*import\s+(?:static\s+)?(?:android|androidx)(?:\..*)?\s*;?\s*/) {
                    violations << "${source.path}:${number}: Android import in shared vendor protocol source"
                }
            }
        }

        androidSources.each { source ->
            source.eachLine { line, number ->
                if (line ==~ /\s*package\s+com\.wuming\.tv\.core(?:\..+)?\s*;?\s*/) {
                    violations << "${source.path}:${number}: Android source cannot own a core package"
                }
            }
        }

        def androidBoundaryRules = [
                'app/src/main/java/com/wuming/android/tv/bean/History':
                        ~/(?:com\.wuming\.android\.tv\.(?:db|repository)|HistoryRepository|DataCache|AppDatabase)/,
                'app/src/main/java/com/wuming/android/tv/bean/Keep':
                        ~/(?:com\.wuming\.android\.tv\.(?:db|repository)|FavoriteRepository|DataCache|AppDatabase)/,
                'app/src/main/java/com/wuming/android/tv/recommendation/ViewingHistoryTracker':
                        ~/(?:com\.wuming\.android\.tv\.db|AppDatabase|Task\.scheduler|RecommendationEngine)/,
        ]
        androidBoundaryRules.each { path, forbidden ->
            def candidates = ['java', 'kt'].collect { new File(verificationRoot, "${path}.${it}") }
                    .findAll { it.isFile() }
            if (candidates.size() != 1) {
                violations << "${path}: expected exactly one Java or Kotlin source, found ${candidates.size()}"
                return
            }
            def source = candidates.first()
            source.eachLine { line, number ->
                if (line =~ forbidden) violations << "${source.path}:${number}: ${line.trim()}"
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Generic library boundary verification failed:\n" + violations.join('\n'))
        }
    }
}

def verifyDesktopBoundaries = tasks.register('verifyDesktopBoundaries') {
    group = 'verification'
    description = 'Keeps the desktop client independent from Android and Android runtime modules.'

    def desktopSources = fileTree(rootProject.file('desktop/src')) {
        include '**/*.java', '**/*.kt'
    }

    doLast {
        def violations = new ArrayList(desktopModelViolations)

        desktopSources.each { source ->
            source.eachLine { line, number ->
                if (line ==~ /\s*import\s+(?:static\s+)?(?:android|androidx|com\.wuming\.android|com\.github\.catvod)(?:\..*)?\s*;?\s*/) {
                    violations << "${source.path}:${number}: ${line.trim()}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Desktop boundary verification failed:\n" + violations.join('\n'))
        }
    }
}

def verifyCodeLifecycleIsolation = tasks.register('verifyCodeLifecycleIsolation') {
    group = 'verification'
    description = 'Prevents incubating, archived, or frozen vendor source from entering production builds.'

    def nativeArtifacts = fileTree('app/libs') {
        include '*.aar', '*.jar'
    }

    doLast {
        def violations = new ArrayList(lifecycleModelViolations)


        isolatedNativeSources.each { sourceName, metadata ->
            if (!new File(verificationRoot, metadata.source).isDirectory()) {
                violations << "Isolated native source is missing: ${metadata.source}/"
            }
            def artifact = new File(verificationRoot, "app/libs/${metadata.artifact}")
            if (!artifact.isFile()) {
                violations << "Production artifact is missing: app/libs/${metadata.artifact}"
            } else {
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                        .digest(artifact.bytes).encodeHex().toString()
                if (digest != metadata.sha256) {
                    violations << "Production artifact hash changed without lifecycle review: " +
                            "app/libs/${metadata.artifact}"
                }
            }
        }

        nativeArtifacts.each { artifact ->
            if (artifact.name ==~ /(?i).*(?:incubat|experimental|prototype|abandon|archive).*/) {
                violations << "Isolated lifecycle artifact must not be packaged: ${artifact.path}"
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Code lifecycle isolation failed:\n" + violations.join('\n'))
        }
    }
}

tasks.register('check') {
    group = 'verification'
    dependsOn verifyCodeLifecycleIsolation, verifyGenericLibraryBoundaries, verifyDesktopBoundaries
    dependsOn 'verifyJavaRetention'
}

tasks.register('verifyJavaRetention', Exec) {
    group = 'verification'
    description = 'Protects explicitly retained Java contracts from routine language migration.'
    workingDir verificationRoot
    commandLine 'python3', 'scripts/check-java-retention.py'
}

def pythonUnitTests = tasks.register('pythonUnitTests', Exec) {
