plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
}

group = 'com.wuming.tv'
version = '0.1.0-SNAPSHOT'

base {
    archivesName = 'tvbox-playback-core'
}

java {
    withSourcesJar()
}

// Contract-required Java facades have a distinct home; retain their original packages.
sourceSets.main.java.srcDir('src/main/java-required')

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation libs.gson
    implementation libs.okhttp
    implementation project(':libraries:base-core')
    testImplementation libs.junit
}

tasks.named('check') {
    dependsOn rootProject.tasks.named('verifyGenericLibraryBoundaries')
}
