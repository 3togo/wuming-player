plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
}

group = 'com.wuming.tv'
version = '0.1.0-SNAPSHOT'

base {
    archivesName = 'tvbox-media-core'
}

java {
    withSourcesJar()
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation project(':libraries:cloud-core')
    implementation project(':libraries:cache-core')
    implementation libs.gson
    implementation libs.okhttp
    testImplementation libs.junit
}

tasks.named('check') {
    dependsOn rootProject.tasks.named('verifyGenericLibraryBoundaries')
}
