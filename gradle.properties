org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
# Bound concurrent variant compilation and give the Kotlin compiler its own heap.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx8g
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=false
android.useFullClasspathForDexingTransform=true
org.gradle.daemon=true
org.gradle.configuration-cache=true
# org.gradle.parallel=false
# org.gradle.configureondemand=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Force IPv4 to fix Java networking "Connection refused" issue
systemProp.java.net.preferIPv4Stack=true
nativePythonEnabled=true
