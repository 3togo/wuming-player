tasks.register("validateReleaseSource") {
    group = "verification"
    description = "Requires release artifacts to be built from a clean source tree."
    def sourceDirectory = rootProject.projectDir
    def allowDirty = providers.gradleProperty("allowDirtyRelease").orElse("false").map { it.toBoolean() }.get()
    doLast {
        if (allowDirty) {
            logger.warn("validateReleaseSource: clean-tree check skipped (allowDirtyRelease=true)")
            return
        }
        def statusProcess = new ProcessBuilder("git", "status", "--porcelain")
                .directory(sourceDirectory)
                .redirectErrorStream(true)
                .start()
        def dirty = statusProcess.inputStream.text.trim()
        if (statusProcess.waitFor() != 0 || !dirty.isEmpty()) {
            throw new GradleException(
                    "Release assembly requires a clean working tree. " +
                    "Use -PallowDirtyRelease to override during development.")
        }
    }
}

tasks.register("validateReleaseVerification") {
    group = "verification"
    description = "Compatibility alias for the offline unit-test acceptance and clean-source gates."
    dependsOn ":unitAcceptanceBaseline", "validateReleaseSource"
}

