def verifyNoHardcodedUiDimensions = tasks.register("verifyNoHardcodedUiDimensions") {
    group = "verification"
    description = "Rejects raw UI dimensions outside the centralized sizing registries."

    def layoutSources = fileTree("src") {
        include "**/res/layout*/**/*.xml"
        exclude "**/res_backup*/**"
    }
    def codeSources = fileTree("src") {
        include "**/*.java", "**/*.kt"
        exclude "**/res_backup*/**", "**/test/**", "**/*AndroidTest/**"
    }

    doLast {
        def violations = []
        def rawXmlDimension = ~/=\s*["']-?\d+(?:\.\d+)?(?:dp|sp|px)["']/
        layoutSources.each { source ->
            source.eachLine { line, number ->
                if (rawXmlDimension.matcher(line).find()) {
                    violations << "${source.path}:${number}: ${line.trim()}"
                }
            }
        }

        def sourcePatterns = [
                ~/ResUtil\.(?:dp2px|sp2px)\(\s*-?\d/,
                ~/setTextSize\([^,\n]*,\s*-?\d/,
                ~/setTextSize\(\s*-?\d/,
                ~/getScreen(?:Width|Height)\([^)]*\)\s*\*\s*0\.\d/,
                ~/new SpaceItemDecoration\([^)\n]*,\s*(?:8|16)\s*\)/,
                ~/new SpaceItemDecoration\(\s*(?:8|16)\s*\)/,
                ~/new CustomRowPresenter\(\s*(?:8|16)(?:\s*[,)]?)/
        ]
        codeSources.each { source ->
            source.eachLine { line, number ->
                if (sourcePatterns.any { it.matcher(line).find() }) {
                    violations << "${source.path}:${number}: ${line.trim()}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Hardcoded UI dimensions found. Use @dimen, FontScale, or LayoutConfig:\n"
                            + violations.join("\n"))
        }
    }
}

def verifyDialogThemeContract = tasks.register("verifyDialogThemeContract") {
    group = "verification"
    description = "Rejects literal colors in popup resources and verifies shared dialog theming."

    def dialogResources = fileTree("src") {
        include "**/res/layout*/**/*dialog*.xml"
        include "**/res/layout*/**/adapter_site.xml"
        include "**/res/drawable*/**/*dialog*.xml"
        include "**/res/drawable*/**/shape_site*.xml"
        include "**/res/drawable*/**/selector_site*.xml"
        exclude "**/res_backup*/**"
    }
    def resourceRoot = file("src")

    doLast {
        def violations = []
        def literalUiColor = ~/(?i)android:(?:background|backgroundTint|color|textColor|textColorHint)\s*=\s*["']#[0-9a-f]{3,8}["']/
        def legacyPaletteColor = ~/(?i)(?:android|app):(?:background|backgroundTint|buttonTint|color|tabTextColor|textColor|textColorHint)\s*=\s*["']@color\/(?:black|white|grey|text|color_theme)(?:_[0-9]+)?["']/
        dialogResources.each { source ->
            source.eachLine { line, number ->
                if (literalUiColor.matcher(line).find()) {
                    violations << "${source.path}:${number}: ${line.trim()}"
                }
                if (legacyPaletteColor.matcher(line).find()) {
                    violations << "${source.path}:${number}: ${line.trim()}"
                }
            }
        }

        def sharedStyles = new File(resourceRoot, "main/res/values/styles.xml").text
        if (!sharedStyles.contains('name="AppDialogStyle"')) {
            violations << "src/main/res/values/styles.xml: missing AppDialogStyle"
        }

        ["mobile", "leanback"].each { mode ->
            def styles = new File(resourceRoot, "${mode}/res/values/styles.xml").text
            ["materialAlertDialogTheme", "bottomSheetDialogTheme", "dialogSurface", "dialogOnSurface"].each { token ->
                if (!styles.contains("name=\"${token}\"")) {
                    violations << "src/${mode}/res/values/styles.xml: missing ${token}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Dialog theme contract violations found. Use semantic dialog attributes:\n"
                            + violations.join("\n"))
        }
    }
}

