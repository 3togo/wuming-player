// Reproducible builds: stamp artifacts with the commit hash instead of a
// wall-clock timestamp so the same commit always produces the same versionName/APK name.
// The 12-char hash is split into 8-char commit date (YYYYMMDD) + 4-char short hash,
// keeping the same total length while embedding human-readable date info.
def gitCommitDate = providers.exec {
    commandLine "git", "show", "-s", "--format=%cd", "--date=format:%Y%m%d", "HEAD"
    workingDir rootProject.projectDir
    ignoreExitValue = true
}.standardOutput.asText.map { output ->
    def date = output.trim()
    date.isEmpty() ? "00000000" : date
}

def gitCommit = providers.exec {
    commandLine "git", "rev-parse", "HEAD"
    workingDir rootProject.projectDir
    ignoreExitValue = true
}.standardOutput.asText.map { output ->
    def commit = output.trim()
    commit.isEmpty() ? "unknown" : commit.substring(0, 4)
}

def versionStamp = "${gitCommitDate.get()}${gitCommit.get()}"

def updateSettings = new groovy.json.JsonSlurper().parseText(providers.fileContents(rootProject.layout.projectDirectory.file('updates.json')).asText.get())
// The upload command reserves a new version before building selected variants.
def uploadVersion = providers.gradleProperty('wumingUploadVersionCode').orNull
if (uploadVersion != null) {
    def code = uploadVersion.toInteger()
    if (code <= (updateSettings.versionCode as int) || code > 2100000000) {
        throw new GradleException('Upload versionCode must increase and remain within Android limits')
    }
    updateSettings.versionCode = code
}

def statefulDeviceTests = providers.gradleProperty("statefulDeviceTests").isPresent()

