// Consume AGP's combined variant artifacts, including Kotlin and nested implementation classes.
// A dedicated collection task keeps archive expansion and copying configuration-cache safe.
abstract class KeyLogicCoverageClasses extends DefaultTask {
    @Classpath abstract ListProperty<RegularFile> getClassJars()
    @Classpath abstract ListProperty<Directory> getClassFolders()
    @Input abstract ListProperty<String> getClassNames()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @Inject abstract FileSystemOperations getFileSystemOperations()
    @Inject abstract ArchiveOperations getArchiveOperations()

    @TaskAction
    void collectClasses() {
        def names = classNames.get()
        def folders = classFolders.get().collect { it.asFile }
        def archives = classJars.get().collect { archiveOperations.zipTree(it.asFile) }
        def destination = outputDirectory.get().asFile
        fileSystemOperations.sync {
            into destination
            from folders
            from archives
            include names.collectMany { [it + '.class', it + '$*.class'] }
            duplicatesStrategy = DuplicatesStrategy.FAIL
        }
        def missing = names.findAll { !new File(destination, it + '.class').isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Coverage class artifacts are missing: " + missing.join(', '))
        }
    }
}

def keyLogicClasses = tasks.register('collectKeyLogicCoverageClasses', KeyLogicCoverageClasses) {
    classNames.set([
