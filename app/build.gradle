    if (statefulDeviceTests && task.name.startsWith("connected")
            && task.name.endsWith("DebugAndroidTest")) {
        task.doFirst {
            throw new GradleException(
                    "Stateful tests must use scripts/run_stateful_opendrive_tests.sh; " +
                    "the Android connected task uninstalls the target app and its private data.")
        }
    }
}

