// Keep every variant explicitly buildable, but select only the everyday
// phone/TV targets in aggregate builds. Filter after AGP has wired its
// variant lists, preserving signing and release verification dependencies.
def includeAllVariants = providers.gradleProperty('includeAllVariants')
        .orElse(providers.gradleProperty('includeLeanbackLite')) // Previous all-mode opt-in.
        .map { it.toBoolean() }.getOrElse(false)
gradle.projectsEvaluated {
    if (!includeAllVariants) {
        ['Debug', 'Release'].each { buildTypeName ->
            def aggregate = tasks.named("assemble${buildTypeName}").get()
            def dependencies = aggregate.dependsOn.toList().flatten()
            def selected = ["assembleMobileArm64_v8a${buildTypeName}".toString(),
                            "assembleLeanbackArmeabi_v7a${buildTypeName}".toString()]
            aggregate.setDependsOn(dependencies.findAll {
                !(it instanceof org.gradle.api.tasks.TaskProvider &&
                        it.name.startsWith('assemble') && !selected.contains(it.name))
            })
        }
    }
}

['Debug', 'Release'].each { buildTypeName ->
    tasks.whenTaskAdded { task ->
        if (task.name == "assemble${buildTypeName}") {
            task.finalizedBy "copyApks${buildTypeName}"
        }
    }
    tasks.register("copyApks${buildTypeName}") {
        group = 'build'
        description = "Copy ${buildTypeName.toLowerCase()} APKs to output folder"
        def targetDirName = buildTypeName.toLowerCase()
        def outputDirectory = rootProject.layout.projectDirectory.dir(targetDirName)
        def apkOutputs = layout.buildDirectory.dir('outputs/apk')
        doLast {
            def outputDir = outputDirectory.asFile
            outputDir.mkdirs()
            outputDir.listFiles({ it.name.endsWith('.apk') } as java.io.FileFilter)?.each { it.delete() }
            apkOutputs.get().asFileTree.matching {
                if (includeAllVariants) {
                    include("**/${targetDirName}/*.apk")
                } else {
                    // Exclude stale APKs from previously built variants.
                    include("**/${targetDirName}/mobile-arm64_v8a-*.apk")
                    include("**/${targetDirName}/leanback-armeabi_v7a-*.apk")
                }
                exclude('androidTest/**')
            }
                    .each { apk ->
                        java.nio.file.Files.copy(apk.toPath(), new File(outputDir, apk.name).toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        logger.lifecycle("Copied ${apk.name} -> ${targetDirName}/")
                    }
        }
    }
}

