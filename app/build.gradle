            // avoids asking the NDK strip tool to process them on every build.
            keepDebugSymbols += [
                    '**/libavif_android.so',
                    '**/libpl_droidsonroids_gif.so',
                    '**/libquickjs-android-wrapper.so',
                    '**/libwuming_python.so',
                    '**/libpython3.13.so',
                    '**/libpython3.so',
                    '**/libcrypto_python.so',
                    '**/libssl_python.so',
                    '**/libsqlite3_python.so',
                    '**/librtmp-jni.so',
            ]
        }
