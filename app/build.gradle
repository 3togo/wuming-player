        }
    }

    configurations.configureEach {
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError', 'MissingLeanbackLauncher', 'ImpliedTouchscreenHardware', 'MissingIntentFilterForMediaSearch', 'MissingLeanbackSupport'
        abortOnError = true
        checkReleaseBuilds = true
    }

    testOptions {
        animationsDisabled = true
    }

    // Opt-in device audits may target the already-installed debug application so
    // Android Keystore entries, cookies, and catalog handles remain app-private.
    // Normal CI always uses the isolated .verification application instead.
    testBuildType = statefulDeviceTests ? "debug" : "verification"

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

