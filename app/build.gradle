    arg("room.generateKotlin", "false")
}

// CPython is built explicitly by scripts/python-runtime/prepare.py, never at configuration time.
if (nativePythonEnabled) {
    ['arm64_v8a', 'armeabi_v7a'].each { abi ->
        def runtime = rootProject.layout.buildDirectory.dir("python-native/android/${abi}")
        android.sourceSets.named(abi) {
            assets.srcDir(runtime.get().dir('assets').asFile)
            jniLibs.srcDir(runtime.get().dir('jniLibs').asFile)
        }
        def prepare = tasks.register("prepareNativePython${abi.capitalize()}", Exec) {
            workingDir rootProject.projectDir
            commandLine 'python3', 'scripts/python-runtime/prepare.py', '--android', abi
            inputs.files(rootProject.fileTree('scripts/python-runtime') { exclude 'tests/**', '**/__pycache__/**' },
                    rootProject.fileTree('native/python-runtime'),
                    rootProject.fileTree('libraries/python-runtime/src/main/python') { exclude '**/__pycache__/**' })
            outputs.dir(runtime)
        }
        tasks.configureEach { task ->
            def mergesRuntime = task.name.startsWith('merge') && (task.name.endsWith('Assets') || task.name.endsWith('NativeLibs') || task.name.endsWith('JniLibFolders'))
            def readsRuntimeForLint = task.name.startsWith('lint') || (task.name.startsWith('generate') && task.name.contains('Lint') && task.name.endsWith('Model'))
            if (task.name.contains(abi.capitalize()) && (mergesRuntime || readsRuntimeForLint)) {
                task.dependsOn(prepare)
            }
        }
    }
}
